  <ProductContract>
    <Tagline>A Gemini-powered publishing agent that turns articles, TripCodes, and research archives into searchable, source-grounded memory using MongoDB Atlas, MCP, and Google Cloud.</Tagline>
    <Summary>AITrailblazer transforms publication archives into reusable agent memory. A reader enters a known TripCode, the agent resolves linked article records, claim clusters, and River edges stored in MongoDB, and Gemini generates source-grounded synthesis with follow-up memory.</Summary>
    <ProofCase>DeltaSignal provides the proof archive: more than 300 macro and financial articles that demonstrate why published research needs durable memory, claim continuity, and monitor-next workflows.</ProofCase>

  <OfficialNarrative>
    <Inspiration>Most publishing and research archives are passive. Valuable articles, newsletters, claims, updates, contradictions, and follow-up threads become difficult to retrieve or reuse. AITrailblazer starts from the idea that readers should begin with a memorable TripCode instead of a blank chatbot prompt.</Inspiration>
    <WhatItDoes>AITrailblazer lets a user enter a known TripCode such as HUT-RIVER-001. The agent resolves that code into linked article records, claim clusters, and River edges stored in MongoDB. Gemini generates a concise, source-grounded synthesis that shows what the article said, how it connects to related work, and what the reader should monitor next.</WhatItDoes>
    <HowItWorks>The demo centers on three seeded River articles: a prior thesis, an anchor TripCode article, and a follow-up monitor-next article. MongoDB stores articles, tripcodes, claims, river_edges, reader_sessions, and agent_runs. MCP exposes database-grounded context, Gemini synthesizes the answer, and Google Cloud provides deployment and orchestration.</HowItWorks>
    <Impact>AITrailblazer turns static publishing into living memory. Publishers make old articles useful again, analysts preserve thesis trails, and readers navigate complex archives through a simple code instead of disconnected search or blank chat history.</Impact>
  </OfficialNarrative>

      constructor() {
        super();
        this.apiBase = DEFAULT_API_BASE;
        this.tripcode = 'HUT-RIVER-001';
        this.question = 'What should I monitor next?';
        this.loading = false;
        this.error = '';
        this.demo = null;
        this.resolved = null;
        this.lastMode = 'judge-demo';
      }

      firstUpdated() {
        this.runJudgeDemo();
      }

      apiURL(path) {
        return `${this.apiBase.replace(/\/+$/, '')}${path}`;
      }

      async fetchJSON(path, options = {}) {
        const response = await fetch(this.apiURL(path), {
          ...options,
          headers: {
            Accept: 'application/json',
            ...(options.headers || {})
          }
        });
        const text = await response.text();
        let body = {};
        if (text.trim()) {
          body = JSON.parse(text);
        }
        if (!response.ok) {
          throw new Error(body.error || `Request failed with HTTP ${response.status}`);
        }
        return body;
      }

      async runJudgeDemo() {
        this.loading = true;
        this.error = '';
        this.lastMode = 'judge-demo';
        try {
          const demo = await this.fetchJSON('/v1/judge-demo');
          this.demo = demo;
          this.resolved = demo.tripcode_result;
          this.tripcode = demo.tripcode_result?.tripcode || this.tripcode;
        } catch (error) {
          this.error = error.message || String(error);
        } finally {
          this.loading = false;
        }
      }

      async resolveTripCode() {
        this.loading = true;
        this.error = '';
        this.lastMode = 'resolve';
        try {
          const params = new URLSearchParams({
            tripcode: this.tripcode || 'HUT-RIVER-001',
            session_id: DEMO_SESSION_ID,
            question: this.question || 'Resolve this article into agent memory.',
            include_river: 'true',
            include_mongo_fit: 'true'
          });
          this.resolved = await this.fetchJSON(`/resolve?${params.toString()}`);
        } catch (error) {
          this.error = error.message || String(error);
        } finally {
          this.loading = false;
        }
      }

      runtimeItems() {
        return this.demo?.runtime_proof || this.resolved?.runtime_proof || [];
      }

      proofSummaryItems() {
        const panels = this.demo?.required_panels?.length || 7;
        const collections = this.demo?.required_collections?.length || 6;
        const flows = this.demo?.live_flows?.filter((flow) => flow.verified).length || 3;
        const riverNodes = this.resolved?.packet?.river?.nodes?.length || 3;
        return [
          [panels, 'judge panels'],
          [collections, 'MongoDB collections'],
          [flows, 'verified live flows'],
          [riverNodes, 'River article nodes']
        ];
      }

      isLiveStatus(status = '') {
        const text = status.toLowerCase();
        return text.includes('live') || text.includes('deployment') || text.includes('ready');
      }

      renderStatusPills() {
        const items = this.runtimeItems();
        if (!items.length) {
          return html`<div class="empty-state">Run the hosted proof to load runtime status.</div>`;
        }
        return html`
          <div class="status-strip">
            ${items.map((item) => html`
              <div class="status-pill ${this.isLiveStatus(item.status) ? 'live' : ''}">
                <strong>${item.system}</strong>
                <span>${item.status}</span>
              </div>
            `)}
          </div>
        `;
      }

      renderRiverNodes() {
        const nodes = this.resolved?.packet?.river?.nodes || [];
        if (!nodes.length) {
          return html`<div class="empty-state">River nodes will appear after a proof run.</div>`;
        }
        return html`
          <div class="river-list">
            ${nodes.map((node) => html`
              <article class="mini-card">
                <small>${node.kind}</small>
                <h3>${node.title}</h3>
                <p>${node.description}</p>
              </article>
            `)}
          </div>
        `;
      }

      renderClaims() {
        const claims = this.resolved?.packet?.article?.claims || [];
        if (!claims.length) {
          return html``;
        }
        return html`
          <ul class="claim-list">
            ${claims.map((claim) => html`<li>${claim}</li>`)}
          </ul>
        `;
      }

      renderCollections() {
        const collections = this.demo?.required_collections || [];
        if (!collections.length) {
          return html`<div class="empty-state">Collection proof loads from /v1/judge-demo.</div>`;
        }
        return html`
          <div class="mini-list">
            ${collections.map((collection) => html`
              <article class="mini-card">
                <small>${collection.seeded && collection.visible ? 'seeded + visible' : 'pending'}</small>
                <h3>${collection.name}</h3>
                <p>${collection.purpose}</p>
              </article>
            `)}
          </div>
        `;
      }

      renderLiveDemo() {
        const article = this.resolved?.packet?.article;
        const followUp = this.demo?.follow_up_result;
        const flows = this.demo?.live_flows || [];
        return html`
          <section id="live-demo">
            <div class="inner">
              <div class="section-head">
                <h2>Try the live proof</h2>
                <p>Run the hosted Cloud Run agent path and render the exact TripCode, River, MongoDB, MCP, Gemini, and second-turn memory evidence judges need to see.</p>
              </div>
              <div class="demo-grid">
                <div class="demo-panel">
                  <div class="demo-kicker">
                    <span>Hosted Cloud Run</span>
                    <span>Official MongoDB MCP</span>
                    <span>Gemini + Agent Builder</span>
                  </div>
                  <div class="proof-summary">
                    ${this.proofSummaryItems().map(([value, label]) => html`
                      <div class="summary-tile">
                        <strong>${value}</strong>
                        <span>${label}</span>
                      </div>
                    `)}
                  </div>
                  <div class="control-grid">
                    <label>
                      TripCode
                      <input .value=${this.tripcode} @input=${(event) => { this.tripcode = event.target.value; }}>
                    </label>
                    <label>
                      Follow-up question
                      <input .value=${this.question} @input=${(event) => { this.question = event.target.value; }}>
                    </label>
                  </div>
                  <div class="demo-actions">
                    <button class="button primary" type="button" ?disabled=${this.loading} @click=${this.runJudgeDemo}>${this.loading && this.lastMode === 'judge-demo' ? 'Loading proof...' : 'Run hosted proof'}</button>
                    <button class="button" type="button" ?disabled=${this.loading} @click=${this.resolveTripCode}>${this.loading && this.lastMode === 'resolve' ? 'Resolving...' : 'Resolve TripCode'}</button>
                  </div>
                  <details class="advanced">
                    <summary>Advanced endpoint</summary>
                    <label>
                      API base
                      <input .value=${this.apiBase} @input=${(event) => { this.apiBase = event.target.value; }}>
                    </label>
                  </details>
                  ${this.error ? html`<div class="error-box">${this.error}</div>` : ''}
                  ${this.renderStatusPills()}

                  <div class="demo-layout">
                    <div>
                      <article class="mini-card">
                        <small>${this.resolved?.mode || 'waiting'}</small>
                        <h3>${article?.title || 'TripCode packet not loaded yet'}</h3>
                        <p>${this.resolved?.summary || 'Run the hosted proof to load source-grounded synthesis.'}</p>
                        ${this.renderClaims()}
                      </article>
                      <h3 class="subhead">River memory</h3>
                      ${this.renderRiverNodes()}
                    </div>
                    <div>
                      <article class="mini-card">
                        <small>second-turn memory</small>
                        <h3>${followUp?.tripcode || this.resolved?.tripcode || 'HUT-RIVER-001'}</h3>
                        <p>${followUp?.summary || 'The judge proof loads follow-up memory from the stored session context.'}</p>
                      </article>
                      <h3 class="subhead">MongoDB collections</h3>
                      ${this.renderCollections()}
                    </div>
                  </div>
                </div>
                <aside class="demo-panel">
                  <h3>Proof checklist</h3>
                  <div class="mini-list">
                    ${flows.length ? flows.map((flow) => html`
                      <article class="mini-card">
                        <small>${flow.verified ? 'verified' : 'pending'}</small>
                        <h3>${flow.name}</h3>
                        <p>${flow.outcome}</p>
                      </article>
                    `) : html`<div class="empty-state">The live flow checklist appears after the proof loads.</div>`}
                  </div>
                </aside>
              </div>
            </div>
          </section>
        `;
      }

      render() {
        return html`
          <div class="shell">
            <header>
              <nav>
                <div class="brand">
                  <div class="mark" aria-hidden="true">AI</div>
                  <span>AITrailblazer Publishing</span>
                </div>
                <div class="navlinks" aria-label="Page links">
                  <a href="#live-demo">Try live</a>
                  <a href="#resources">Resources</a>
                  <a href="#proof">Proof</a>
                  <a href="#checklist">Checklist</a>
                  <a href="#links">Links</a>
                </div>
              </nav>
            </header>

            <main>
              <div class="hero">
                <div>
                  <p class="eyebrow">Google Cloud Rapid Agent Hackathon</p>
                  <h1>AITrailblazer AI Agent Publishing.</h1>
                  <p class="lede">Turn publication archives into Gemini-powered TripCode, River, MongoDB, and MCP agent memory. Enter one code, see the source packet, inspect runtime proof, and continue the conversation.</p>
                  <div class="actions">
                    <a class="button primary" href="#live-demo">Try live proof</a>
                    <a class="button" href="#proof">View runtime proof</a>
                    <a class="button" href="./docs/AITrailblazer_AI_Agent_Publishing_Public_Docs_2026_06_10.html">Public docs</a>
                  </div>
                </div>
                <figure class="media">
                  <img src="./img/AITrailblazerAI.png" alt="AITrailblazer AI Agent Publishing visual identity">
                  <figcaption class="media-footer">
                    <div class="metric"><strong>300+</strong><span>DeltaSignal articles</span></div>
                    <div class="metric"><strong>MongoDB</strong><span>Closest memory partner</span></div>
                  </figcaption>
                </figure>
              </div>

              ${this.renderLiveDemo()}

              <section>
                <div class="inner">
                  <div class="section-head">
                    <h2>Official Submission Narrative</h2>
                    <p>A reader should not have to start from a blank chatbot prompt. They should be able to start from a memorable code in an article, newsletter, or research note and recover the source context, related claims, and the story's evolution over time.</p>
                  </div>
                  <div class="grid">
                    ${officialNarrative.map(([title, body]) => html`
                      <article class="card">
                        <h3>${title}</h3>
                        <p>${body}</p>
                      </article>
                    `)}
                  </div>
                </div>
              </section>

              <section id="proof">
                <div class="inner">
                  <div class="section-head">
                    <h2>Judge Proof</h2>
                    <p>The demo is intentionally small: three seeded River articles, one TripCode path, one River, one follow-up memory turn, and a visible runtime proof package.</p>
                  </div>
                  <div class="grid">
                    ${proofPanels.map(([title, body]) => html`
                      <article class="card">
                        <h3>${title}</h3>
                        <p>${body}</p>
                      </article>
                    `)}
                  </div>
                </div>
              </section>

              <section>
                <div class="inner">
                  <div class="section-head">
                    <h2>Three Live Flows</h2>
                    <p>If these work reliably, the project is a functioning agent rather than a concept page.</p>
                  </div>
                  <div class="checklist">
                    ${liveFlows.map(([title, body]) => html`
                      <div class="row">
                        <div class="dot" aria-hidden="true">✓</div>
                        <div><strong>${title}</strong><span>${body}</span></div>
                      </div>
                    `)}
                  </div>
                </div>
              </section>

              <section>
                <div class="inner">
                  <div class="section-head">
                    <h2>MongoDB Objects</h2>
                    <p>These collections make MongoDB structurally necessary, not decorative.</p>
                  </div>
                  <div class="grid">
                    ${collections.map(([title, body]) => html`
                      <article class="card">
                        <h3>${title}</h3>
                        <p>${body}</p>
                      </article>
                    `)}
                  </div>
                </div>
              </section>

              <section id="resources">
                <div class="inner">
                  <div class="section-head">
                    <h2>Technology Stack</h2>
                    <p>TripCodes make knowledge addressable, MongoDB makes it structured and retrievable, MCP makes it agent-accessible, and Gemini turns it into clear synthesis.</p>
                  </div>
                  <div class="grid">
                    <article class="card"><h3>MongoDB Atlas</h3><p>Stores articles, TripCodes, claims, River edges, reader sessions, and agent runs.</p></article>
                    <article class="card"><h3>MongoDB MCP</h3><p>Exposes database-grounded context to the agent retrieval and proof path.</p></article>
                    <article class="card"><h3>Gemini</h3><p>Generates grounded synthesis from retrieved publisher memory instead of an empty prompt.</p></article>
                    <article class="card"><h3>Google Cloud</h3><p>Hosts the Cloud Run experience and provides the agent orchestration path.</p></article>
                  </div>
                </div>
              </section>

              <section id="checklist">
                <div class="inner">
                  <div class="section-head">
                    <h2>Submission Checklist</h2>
                    <p>Keep the name, proof case, MongoDB fit, and public/private boundaries clear.</p>
                  </div>
                  <div class="checklist">
                    ${checklist.map(([title, body]) => html`
                      <div class="row">
                        <div class="dot" aria-hidden="true">✓</div>
                        <div><strong>${title}</strong><span>${body}</span></div>
                      </div>
                    `)}
                  </div>
                </div>
              </section>

              <section id="links">
                <div class="inner">
                  <div class="section-head">
                    <h2>Working Links</h2>
                    <p>Start from the official Devpost resource page, then move into local publishing artifacts.</p>
                  </div>
                  <div class="links">
                    ${links.map(([label, href]) => html`
                      <a class="link-card" href=${href}>
                        <span>${label}</span>
                        <span aria-hidden="true">→</span>
                      </a>
                    `)}
                  </div>
                </div>
              </section>
            </main>

            <footer>
              <div class="inner">
                <span>AITrailblazer AI Agent Publishing</span>
                <span>No secrets, no Devpost session data, no private runtime credentials.</span>
              </div>
            </footer>
          </div>
        `;
      }
    }

    customElements.define('ai-publishing-surface', AIPublishingSurface);
  </script>
</body>
</html>
