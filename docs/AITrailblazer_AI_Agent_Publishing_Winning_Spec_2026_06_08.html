          grid-template-columns: repeat(4, minmax(0, 1fr));
          gap: 12px;
        }
        .cards-3 {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .card {
          min-height: 180px;
          border: 1px solid var(--line);
          border-radius: 8px;
          background: var(--panel);
          padding: 18px;
        }
        .card h3 {
          margin: 0 0 8px;
          font-size: 18px;
          color: var(--ink);
        }
        .card p {
          margin: 0;
          color: var(--muted);
          font-size: 14px;
        }
        .card .tag {
          display: inline-block;
          margin-bottom: 10px;
          color: var(--green);
          font-size: 12px;
          font-weight: 850;
        }
        .flow {
          display: grid;
          grid-template-columns: repeat(6, minmax(0, 1fr));
          gap: 10px;
        }
        .step {
          border: 1px solid rgba(123, 182, 255, .26);
          background: rgba(123, 182, 255, .09);
          border-radius: 8px;
          padding: 14px;
          min-height: 132px;
        }
        .step b {
          display: block;
          color: var(--blue);
          margin-bottom: 8px;
        }
        .step span {
          color: var(--muted);
          font-size: 13px;
        }
        .pipeline {
          display: grid;
          grid-template-columns: repeat(6, minmax(0, 1fr));
          gap: 10px;
          align-items: stretch;
        }
        .pipe-node {
          position: relative;
          min-height: 150px;
          border: 1px solid rgba(110, 231, 168, .24);
          background: rgba(110, 231, 168, .07);
          border-radius: 8px;
          padding: 16px;
        }
        .pipe-node:not(:last-child)::after {
          content: '>';
          position: absolute;
          right: -9px;
          top: 50%;
          transform: translateY(-50%);
          color: var(--gold);
          font-weight: 900;
          z-index: 2;
        }
        .pipe-node b {
          display: block;
          color: var(--green);
          margin-bottom: 8px;
        }
        .pipe-node span {
          color: var(--muted);
          font-size: 13px;
        }
        .matrix {
          display: grid;
          grid-template-columns: 1.2fr 1.7fr 1.2fr;
          border: 1px solid var(--line);
          border-radius: 8px;
          overflow: hidden;
        }
        .matrix div {
          padding: 14px;
          border-bottom: 1px solid var(--line);
          border-right: 1px solid var(--line);
          background: rgba(255, 255, 255, .04);
        }
        .matrix div:nth-child(3n) { border-right: 0; }
        .matrix div:nth-last-child(-n+3) { border-bottom: 0; }
        .matrix .head {
          color: var(--gold);
          font-weight: 850;
          background: rgba(240, 198, 106, .08);
        }
        .panel {
          border: 1px solid var(--line);
          border-radius: 8px;
          background: var(--panel2);
          padding: 18px;
        }
        pre {
          margin: 0;
          white-space: pre-wrap;
          overflow: auto;
          max-height: 420px;
          color: #eadfbf;
          font-size: 12px;
        }
        @media (max-width: 980px) {
          .hero, .grid, .cards-3, .flow, .pipeline, .matrix {
            grid-template-columns: 1fr;
          }
          .pipe-node:not(:last-child)::after {
            content: 'v';
            right: 16px;
            top: auto;
            bottom: -16px;
          }
          .matrix div {
