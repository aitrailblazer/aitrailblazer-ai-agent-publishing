        background: rgba(7,12,21,.7);
        padding: 14px;

        display: block;
        color: #8cc3ff;
        font-size: 11px;
        font-weight: 950;
        letter-spacing: .09em;

        margin-bottom: 7px;

      .infoGrid span { display: block; color: #c2ccda; font-size: 14px; line-height: 1.35; }

    constructor() {

      this.current = 0;

      this.current = (this.current + 1) % slides.length;
    }

    prev() {
      this.current = (this.current + slides.length - 1) % slides.length;
    }

      const slide = slides[this.current] || slides[0];
      return html`

          <header>
            <div class="brand">

              <div><b>AITrailblazer Video Slides</b><span>Under-three-minute public recording storyboard</span></div>

            <section class="slide">

              <div>

                    <div class="diagramRail">

          <div class="nav">
            ${slides.map((item, index) => html`
